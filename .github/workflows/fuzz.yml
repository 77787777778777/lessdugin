# SPDX-License-Identifier: AGPL-3.0-or-later
# Scheduled fuzzing (docs/plan.md M4; fuzz/README.md): each cargo-fuzz target runs for 10 minutes
# on its own runner. A crash, timeout or OOM fails the job and uploads the input; reproduce it with
# `cargo +nightly fuzz run <target> <file>`, fix it in the crate with a regression test, and keep
# the minimised input in fuzz/regressions/<target>/.
name: fuzz
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "600"
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # The nightly cargo-fuzz builds with (sanitizer flags); the xtask itself runs on the pinned
  # stable toolchain of rust-toolchain.toml.
  LESSDUGIN_FUZZ_TOOLCHAIN: nightly-2026-10-22
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [car, commit, dagcbor, lexicon, mst, render]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.LESSDUGIN_FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
          key: fuzz-${{ matrix.target }}
      - run: cargo +${{ env.LESSDUGIN_FUZZ_TOOLCHAIN }} install cargo-fuzz --version =0.13.2 --locked
      - run: cargo xtask fuzz ${{ matrix.target }} --seconds ${{ inputs.seconds || '600' }}
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
