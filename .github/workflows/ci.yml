# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p lessdugin-atp -p lessdugin-lexicon -p lessdugin-markdown -p lessdugin-core -p lessdugin-wasm -- -D warnings
      - run: cargo test --workspace
      # the social-fold vectors again at the final namespace (as `cargo xtask ci`)
      - run: cargo test -p lessdugin-core --features final-ns --test social_vectors
  # The interop, vector and property tests of atp, lexicon and markdown on wasm32-unknown-unknown,
  # in node through wasm-bindgen-test-runner (same version as the workspace wasm-bindgen pin).
  wasm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: cargo install wasm-bindgen-cli --version =0.2.129 --locked
      - run: cargo xtask test-wasm
  lexicons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"
      - run: go install github.com/bluesky-social/goat@latest
      - run: goat lex lint -I large-string lexicons
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
      - run: cargo install wasm-bindgen-cli --version =0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      # the engine wasm (packages/engine/pkg) and its size report in the job summary; over the
      # budget (ADR 0002) the job fails in the last step, after the web checks have run
      - id: wasm-size
        run: cargo xtask wasm --budget --report
        continue-on-error: true
      # the KV conformance module the engine package's tests run (packages/engine/pkg/kvtest)
      - run: cargo xtask wasm --kv-test
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      - name: wasm size budget
        if: steps.wasm-size.outcome != 'success'
        run: |
          echo "::error::the engine wasm failed to build or is over the size budget (see the wasm-size step)"
          exit 1
  # The SPA's end-to-end tests (web/e2e): the demo build in Chromium, including the production
  # CSP and Trusted Types run, axe, the sanitiser vector equality and the keyboard checks. The
  # Playwright version is pinned in web/package.json; its Chromium is installed here.
  web-e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
      - run: cargo install wasm-bindgen-cli --version =0.2.129 --locked
      - run: pnpm install --frozen-lockfile
      # the size budget is enforced by the web job
      - run: cargo xtask wasm
      - run: pnpm --filter @lessdugin/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lessdugin/web run e2e
