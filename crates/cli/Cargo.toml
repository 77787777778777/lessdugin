[package]
name = "lessdugin"
description = "lessdugin: a serverless markdown and media forum on atproto — command line, TUI and local web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "lessdugin"

[[bin]]
name = "lessdugin"
path = "src/main.rs"

[features]
default = ["tui", "web"]
tui = ["dep:lessdugin-tui"]
web = []
# Read and write the final (published) namespace (release builds).
final-ns = ["lessdugin-native/final-ns", "lessdugin-lexicon/final-ns"]
# Devnet mode (`--dev`, a `[network] mode = "devnet"` profile) in release builds. Debug builds
# always have it; release builds without this feature talk only to the public network over
# https/wss (`threat-model.md` INFRA-9).
devnet = []

[dependencies]
lessdugin-core.workspace = true
lessdugin-native.workspace = true
lessdugin-tui = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap_complete.workspace = true
axum.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
lessdugin-markdown.workspace = true
lessdugin-atp.workspace = true
lessdugin-lexicon.workspace = true
crossterm.workspace = true
webbrowser.workspace = true
futures.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
reqwest.workspace = true
