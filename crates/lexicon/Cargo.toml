[package]
name = "lessdugin-lexicon"
description = "lessdugin record types, data-driven lexicon validator and record-key derivation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
# The embedded lexicons are read from the repository root (`include_str!("../../../lexicons/…")`),
# outside this package, so `cargo package` cannot build it. Publishing needs the lexicons vendored
# into the package first.
publish = false

[features]
default = []
# Write and read the final (published) namespace instead of the `.temp` development namespace.
final-ns = []

[dependencies]
lessdugin-atp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Pinned exactly (`data-model.md` §2.2): `maxGraphemes` (rule G2) counts extended grapheme clusters
# as this version computes them (Unicode 17.0). A new version is a behaviour change and must pass
# `testdata/vectors/limits/graphemes.json` unchanged (`tests/graphemes.rs`).
unicode-segmentation = "=1.13.3"
unicode-normalization.workspace = true

# The integration tests also run on wasm32 under node (`cargo xtask test-wasm`). proptest's default
# `fork`/`timeout` features spawn processes, so the wasm32 build takes it without them; its seed
# comes from `getrandom` 0.4 (`crypto.getRandomValues` through `wasm_js`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-test.workspace = true
