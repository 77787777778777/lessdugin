[package]
name = "lessdugin-native"
description = "Native host for the lessdugin engine: HTTP, SQLite storage, WebSockets, keyring sessions, OAuth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["oauth"]
oauth = ["dep:jacquard-oauth"]

[dependencies]
lessdugin-atp.workspace = true
lessdugin-lexicon.workspace = true
lessdugin-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
directories.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tokio-tungstenite.workspace = true
keyring.workspace = true
fd-lock.workspace = true
image.workspace = true
url = { workspace = true, features = ["serde"] }
http.workspace = true
futures.workspace = true
sha2.workspace = true
webbrowser.workspace = true
toml.workspace = true
getrandom.workspace = true
jacquard-oauth = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
lessdugin-testkit = { path = "../testkit", default-features = false }
tempfile.workspace = true
axum.workspace = true
flate2.workspace = true
