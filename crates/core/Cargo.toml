[package]
name = "lessdugin-core"
description = "lessdugin engine: identity, discovery, sync, outbox, verification and the deterministic social fold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["verify"]
verify = []
# Generate TypeScript types for the DTOs (used by lessdugin-wasm). tsify's derives expand to
# `wasm_bindgen` items, so the feature brings that crate in too.
tsify = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
lessdugin-atp.workspace = true
lessdugin-lexicon.workspace = true
futures.workspace = true
http.workspace = true
url.workspace = true
tracing.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
img-parts.workspace = true
imagesize.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
# Integration tests (tests/) run the engine over the in-memory host.
lessdugin-testkit.workspace = true
