[package]
name = "lessdugin-testkit"
description = "Test support: in-memory host, fake PDS, mini-Jetstream, vector runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Serve a FakeNet over real HTTP on 127.0.0.1 (CLI tests): axum on an owned Tokio runtime.
http = ["dep:axum", "dep:tokio"]

[dependencies]
lessdugin-atp.workspace = true
lessdugin-lexicon.workspace = true
lessdugin-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
k256.workspace = true
url.workspace = true
http.workspace = true
futures.workspace = true
data-encoding.workspace = true
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# End-to-end tests against the local devnet (LESSDUGIN_E2E=1) need a real HTTP client.
tokio.workspace = true
reqwest.workspace = true
