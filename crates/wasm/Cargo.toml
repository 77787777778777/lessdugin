[package]
name = "lessdugin-wasm"
description = "WebAssembly bindings for the lessdugin engine (used by the SPA)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["math", "verify"]
# MathML through math-core (lfm-1.md §7.2); without it the renderer emits `<span data-tex>`.
math = ["lessdugin-markdown/math"]
# Record verification (ADR 0002 rule 5: `xtask wasm --report` prints its marginal size).
verify = ["lessdugin-core/verify"]
# Test-only builds (`cargo xtask wasm --kv-test`): export `kvConformance(store)`, which runs the
# shared `KvStore` contract and record-store scenario of lessdugin-testkit against a JS store
# (the IndexedDB store of @lessdugin/engine under vitest). Never part of the SPA's build.
kv-conformance = ["dep:lessdugin-testkit", "debug-panic"]
# Report Rust panics on `console.error` (test and debug builds).
debug-panic = []
vectors = []

[dependencies]
lessdugin-core = { path = "../core", default-features = false }
lessdugin-markdown = { path = "../markdown", default-features = false }
lessdugin-atp.workspace = true
lessdugin-lexicon.workspace = true
lessdugin-testkit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
url.workspace = true
# ADR 0002 rule 6: the `url` crate is part of the core's API (`Target::Anon(url::Url)`, the
# configuration), so its IDNA back end is chosen here: idna_adapter 1.0.x is ASCII-only (no
# ICU4X tables in the wasm: about 46 KB gz less) and rejects non-ASCII host names, which closes
# IDN-homograph hosts as well. Cargo.lock holds one version for the whole workspace, so native
# builds parse URLs the same way (identity endpoints and handles are ASCII; LFM's own URL
# policy does not use the `url` crate).
idna_adapter = "=1.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The worker installs no tracing subscriber, so the core's log events are compiled out of the
# wasm32 build (ADR 0002 size hygiene). Target-specific, so native builds keep their logging.
tracing = { workspace = true, features = ["max_level_off", "release_max_level_off"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dev-dependencies]
lessdugin-testkit.workspace = true
