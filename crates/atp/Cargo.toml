[package]
name = "lessdugin-atp"
description = "Minimal, wasm-safe AT Protocol primitives: syntax types, DAG-CBOR, CIDs, CAR, MST proofs, commit verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
cid.workspace = true
multihash.workspace = true
ipld-core.workspace = true
sha2.workspace = true
k256.workspace = true
p256.workspace = true
multibase.workspace = true
data-encoding.workspace = true
serde.workspace = true
# `float_roundtrip`: correctly rounded float parsing, so a whole-number JSON float such as
# `9007199254740991.0` becomes the integer JavaScript's `JSON.parse` yields (record CIDs must agree
# with the reference implementation; see `datamodel`). Pure Rust, a few KiB of wasm.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# Cross-check only: the crate has its own strict DAG-CBOR codec (src/dagcbor.rs) so that depth,
# size and canonical-form checks happen before allocation; tests assert byte-equality with this
# reference encoder.
serde_ipld_dagcbor.workspace = true
