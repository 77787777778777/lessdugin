[package]
name = "lessdugin-atp"
description = "Minimal, wasm-safe AT Protocol primitives: syntax types, DAG-CBOR, CIDs, CAR, MST proofs, commit verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
cid.workspace = true
multihash.workspace = true
ipld-core.workspace = true
sha2.workspace = true
k256.workspace = true
p256.workspace = true
multibase.workspace = true
data-encoding.workspace = true
serde.workspace = true
# `float_roundtrip`: correctly rounded float parsing, so a whole-number JSON float such as
# `9007199254740991.0` becomes the integer JavaScript's `JSON.parse` yields (record CIDs must agree
# with the reference implementation; see `datamodel`). Pure Rust, a few KiB of wasm.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
# Cross-check only: the crate has its own strict DAG-CBOR codec (src/dagcbor.rs) so that depth,
# size and canonical-form checks happen before allocation; tests assert byte-equality with this
# reference encoder.
serde_ipld_dagcbor.workspace = true

# The interop and property tests also run on wasm32 under node (`cargo xtask test-wasm`). proptest's
# default `fork`/`timeout` features spawn processes, so the wasm32 build takes it without them;
# its seed comes from `getrandom` 0.4 (`crypto.getRandomValues` through `wasm_js`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen-test.workspace = true
