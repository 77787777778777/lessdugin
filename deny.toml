# cargo-deny configuration (docs/spec/threat-model.md, supply chain).
[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "0BSD", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "OFL-1.1",
  "AGPL-3.0-or-later", "BSL-1.0", "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
